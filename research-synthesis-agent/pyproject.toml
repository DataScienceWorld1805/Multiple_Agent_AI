[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-synthesis-agent"
version = "0.1.0"
description = "Multi-agent research and synthesis system (orchestrator-worker)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0,<0.4",
  "langchain-core>=0.3.0,<0.4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "tenacity>=8.2,<10",
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  "anthropic>=0.34,<1",
  "google-genai>=1.0,<2",
  "arxiv>=2.1,<3",
  "chromadb>=0.5,<0.6",
  "typing-extensions>=4.12,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "duckduckgo-search>=6.0,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
  "black>=24.4,<26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 88
target-version = ["py311"]
