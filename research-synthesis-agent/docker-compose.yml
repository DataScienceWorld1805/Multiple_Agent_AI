services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: research-synthesis-agent:latest
    env_file:
      - .env
    volumes:
      - chroma_data:/app/data/chroma
    working_dir: /app
    # Override entrypoint for compose run flexibility
    entrypoint: []
    environment:
      PYTHONPATH: /app
      CHROMA_PERSIST_DIR: /app/data/chroma
      KB_SEED_PATH: /app/data/kb_documents.json

volumes:
  chroma_data:
